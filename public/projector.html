<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layar Proyektor - Lomba Cerdas Cermat | ASTRO 2026</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="projector-body">
  <!-- Frutiger Aero Floating Bubbles Background -->
  <div class="bubble-decor bubble-1"></div>
  <div class="bubble-decor bubble-2"></div>
  <div class="bubble-decor bubble-4"></div>

  <!-- Top Bar Layar Proyektor -->
  <header class="projector-header">
    <div style="display: flex; align-items: center; gap: 0.9rem;">
      <img src="https://astro-cdn.oktaa.my.id/logo.png" alt="Logo ASTRO" style="height: 46px; width: auto; object-fit: contain; filter: drop-shadow(0 2px 8px rgba(30, 58, 138, 0.2));">
      <div class="projector-title">
        LOMBA CERDAS CERMAT
      </div>
    </div>
    <div id="projector-status" class="projector-status-box status-box-locked">
      MENUNGGU SOAL
    </div>
  </header>

  <!-- Timer Bar -->
  <div id="timer-bar-wrap" class="timer-bar-wrap" style="display: none;">
    <div id="timer-bar-fill" class="timer-bar-fill"></div>
  </div>

  <!-- Panggung Utama (Stage) -->
  <main class="projector-stage">
    <!-- Tampilan Standby -->
    <div id="standby-view" style="text-align: center; display: flex; flex-direction: column; align-items: center; gap: 1.25rem;">
      <span class="astro-pill pill-white" style="font-size: 0.85rem; padding: 0.4rem 1.2rem;">ASTRO 2026 STAGE</span>
      <h1 id="standby-title" style="font-family: var(--font-title); font-size: 3.25rem; font-weight: 900; letter-spacing: -0.02em; color: var(--astro-navy); text-shadow: 0 4px 16px rgba(30, 58, 138, 0.15);">
        SIAPKAN JARI ANDA DI ATAS BEL
      </h1>
      <p id="standby-sub" style="color: var(--text-muted); font-size: 1.35rem; max-width: 650px; font-weight: 500;">
        Bel akan dibuka oleh juri. Peserta tercepat akan mendapatkan kesempatan menjawab.
      </p>
    </div>

    <!-- Tampilan Pemenang Bel -->
    <div id="winner-view" style="display: none; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 2rem;">
      <!-- Kartu Juara #1 (Spotlight WindowCard) -->
      <div class="champion-spotlight">
        <div class="champion-rank-badge">
          PEMENANG BEL TERCEPAT
        </div>
        <div id="champion-name" class="champion-name">
          -
        </div>
        <div class="champion-time-badge">
          WAKTU TERCEPAT (0 ms)
        </div>
      </div>

      <!-- Antrean Posisi #2 dan #3 -->
      <div id="runners-row" class="runners-row" style="display: none;">
        <div id="runner-2" class="runner-card" style="display: none;">
          <div style="display: flex; align-items: center; gap: 0.85rem;">
            <span class="runner-rank">#2</span>
            <span id="runner-2-name" class="runner-name">-</span>
          </div>
          <span id="runner-2-delta" class="runner-delta">+0.000s</span>
        </div>

        <div id="runner-3" class="runner-card" style="display: none;">
          <div style="display: flex; align-items: center; gap: 0.85rem;">
            <span class="runner-rank">#3</span>
            <span id="runner-3-name" class="runner-name">-</span>
          </div>
          <span id="runner-3-delta" class="runner-delta">+0.000s</span>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer Bar Proyektor (GlassBar) -->
  <footer class="projector-footer">
    <div class="qr-widget">
      <img id="proj-qr-img" class="qr-img" src="" alt="QR Code">
      <div class="qr-text">
        <h4>Scan untuk Bergabung</h4>
        <p id="proj-join-url">http://localhost:3001</p>
      </div>
    </div>

    <!-- Info Ronde -->
    <div class="proj-meta-group">
      <div id="round-indicator" class="proj-meta-pill" style="cursor: pointer;" title="Klik untuk reset ronde ke 1 [R]">
        <span>Ronde:</span>
        <strong id="round-number">1</strong>
      </div>
    </div>
  </footer>

  <!-- Grounding Curved Grass Strip Frutiger Aero -->
  <div class="grass-strip" style="position: absolute; bottom: 0; left: 0; right: 0; height: 16px; z-index: 1;"></div>

  <!-- Scripts -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/sound.js?v=9"></script>
  <script src="/js/projector.js?v=9"></script>
</body>
</html>
