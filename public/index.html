<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Buzzer Lomba - Peserta | ASTRO 2026</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Frutiger Aero Floating Bubbles Background -->
  <div class="bubble-decor bubble-1"></div>
  <div class="bubble-decor bubble-2"></div>
  <div class="bubble-decor bubble-3"></div>

  <!-- Header Frosted Glass Nav -->
  <header class="app-header">
    <div class="brand" style="display: flex; align-items: center; gap: 0.5rem;">
      <img src="https://astro-cdn.oktaa.my.id/logo.png" alt="ASTRO Logo" style="height: 28px; width: auto; object-fit: contain; filter: drop-shadow(0 2px 6px rgba(30, 58, 138, 0.18));">
      <span>ASTRO BUZZER</span>
    </div>
    <div class="header-meta">
      <div id="conn-badge" class="badge-pill status-locked">
        <span class="pulse-dot"></span>
        <span id="conn-text">Menghubungkan...</span>
      </div>
    </div>
  </header>

  <main class="user-container">
    <!-- Form Pendaftaran Peserta (WindowCard) -->
    <section id="reg-section" class="window-card reg-card">
      <div class="window-titlebar">
        <div class="window-dot-group">
          <span class="window-close-dot"></span>
          <span class="window-title">PENDAFTARAN PESERTA</span>
        </div>
        <span class="astro-pill pill-white" style="font-size: 0.65rem; padding: 0.2rem 0.6rem;">ASTRO 2026</span>
      </div>
      
      <div class="window-body">
        <h2>Masuk ke Pertandingan</h2>
        <p>Masukkan nama Anda untuk bergabung ke arena bel lomba</p>

        <form id="join-form">
          <div class="form-group">
            <label class="form-label" for="player-name">Nama Peserta</label>
            <input 
              type="text" 
              id="player-name" 
              class="form-input" 
              placeholder="Contoh: Budi Santoso" 
              maxlength="25" 
              required
              autocomplete="off"
            >
          </div>

          <div class="form-group">
            <label class="form-label">Warna Penanda Peserta</label>
            <div class="color-options">
              <button type="button" class="color-btn selected" data-color="#ef4444" style="background-color: #ef4444;" title="Merah"></button>
              <button type="button" class="color-btn" data-color="#3b82f6" style="background-color: #3b82f6;" title="Biru"></button>
              <button type="button" class="color-btn" data-color="#10b981" style="background-color: #10b981;" title="Hijau"></button>
              <button type="button" class="color-btn" data-color="#f59e0b" style="background-color: #f59e0b;" title="Kuning"></button>
              <button type="button" class="color-btn" data-color="#ec4899" style="background-color: #ec4899;" title="Pink"></button>
            </div>
          </div>

          <button type="submit" class="cta-button" id="btn-join" style="width: 100%; margin-top: 0.5rem;">
            Masuk ke Pertandingan
          </button>
        </form>
      </div>
    </section>

    <!-- Arena Tombol Buzzer (WindowCard) -->
    <section id="buzzer-section" class="window-card game-card" style="display: none;">
      <div class="window-titlebar" style="width: 100%;">
        <div class="window-dot-group">
          <span class="window-close-dot"></span>
          <span class="window-title">ARENA PERTANDINGAN</span>
        </div>
        <span class="astro-pill pill-white" style="font-size: 0.65rem; padding: 0.2rem 0.6rem;">LIVE STAGE</span>
      </div>

      <div class="window-body" style="width: 100%; display: flex; flex-direction: column; align-items: center; gap: 1.25rem;">
        <!-- Profil Peserta -->
        <div class="user-profile-bar">
          <span id="profile-indicator" class="participant-indicator team-indicator"></span>
          <span id="profile-name" class="user-display-name">-</span>
          <button id="btn-change-name" style="background:none; border:none; color:var(--astro-blue); font-family:var(--font-heading); font-weight:700; font-size:0.8rem; cursor:pointer; text-decoration:underline;">Ganti</button>
        </div>

        <!-- Status Game Real-Time -->
        <div id="status-text" class="game-status-text status-txt-locked">
          MENUNGGU SOAL
        </div>

        <!-- Tombol Buzzer Tactile 3D Dome -->
        <div class="buzzer-stage">
          <div id="buzzer-halo" class="buzzer-halo"></div>
          <div class="buzzer-base"></div>
          <button id="buzzer-btn" class="buzzer-btn" disabled>
            <span id="btn-label">BEL TERKUNCI</span>
          </button>
        </div>

        <!-- Kartu Hasil Peringkat -->
        <div id="result-box" class="winner-card" style="display: none;">
          <div style="text-align: left;">
            <div style="font-family: var(--font-subtitle); font-size: 0.72rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;">Status Anda</div>
            <div id="result-title" style="font-family: var(--font-title); font-size: 1.15rem; font-weight: 800; color: var(--astro-navy);">TERCEPAT</div>
            <div id="result-delta" style="font-family: var(--font-subtitle); font-size: 0.82rem; font-weight: 700; color: var(--astro-blue);">0 ms</div>
          </div>
          <div id="result-rank" class="winner-rank">#1</div>
        </div>

      </div>
    </section>
  </main>

  <!-- Grounding Curved Grass Strip Frutiger Aero -->
  <div class="grass-strip"></div>

  <!-- Scripts -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/client.js?v=9"></script>
</body>
</html>
